# Run docker-compose build
# Run docker-compose up

version: '2'

services:
  nginx:
    container_name: nginx_container
    restart: always
    image: nginx
    build:
      context: .
      dockerfile: nginx/Dockerfile
    volumes:
     - ./client/dist:/usr/share/nginx/html
    ports:
      - "80:80"
    depends_on:
      - flask

  flask:
    container_name: flask_container
    restart: always
    image: flask
    build: ./server
    volumes:
    - ./server/main:/usr/src/app
    depends_on:
      - app

  app:
    container_name: app_build
    image: flask
    build: ./client
    depends_on:
      - flask
