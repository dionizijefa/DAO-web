<div class="wrapper">
    <div class="page-header page-header-xs" data-parallax="true"
         style="background-image: url('../../assets/img/landing.jpg');">
        <div class="filter"></div>
    </div>
</div>
<ngb-alert *ngIf="rdkitError==true" type="danger" dismissible="true" (click)="removeWarning()">
  <div class="row justify-content-center">
      <ng-container>
        <i class="nc-icon nc-bell-55" style="margin-right: 10px"></i>
      </ng-container>
      Error in loading smiles
      <button type="button" name="button" class="close"></button>
  </div>
</ngb-alert>
<div class="section" style="padding-top: 20px">
        <div class="container">
            <div class="row">
                <div class="col-md-6 mr-auto ml-auto justify-content-center">
                    <h3 class="title mx-auto">Predict the probability of your drug being withdrawn from the market</h3>
                    <form #f="ngForm" class="register-form" (ngSubmit) = "onSubmit(f)">
                    <div class="input-group bg-danger" style="margin-bottom: 10px">
                      <input type="text" class="form-control" name="smilesInput" ngModel required
                             #first="ngModel" placeholder="SMILES">
                    </div>
                    <button *ngIf="predictionRunning==false" class="btn btn-danger btn-block btn-round"
                            style="width:50%; left:50%; margin:0 auto;">Predict</button>
                    </form>
                    <mat-progress-spinner *ngIf="predictionRunning==true"
                      style="margin:0 auto;" mode="indeterminate" [color]="'warn'" [diameter]="40"></mat-progress-spinner>
                </div>
            </div>
        </div>
        <div class="container" style="margin-top: 20px">
            <div class="row justify-content-lg-start">
                <div class="col-md-6 mr-auto ml-auto justify-content-center">
               <h5>Try these molecules: </h5>
                </div>
            </div>
            <div class="row justify-content-center">
                <div class="col-xs-8 text-center">
                    <a> <img src="assets/img/ivermectin.png" width="200" height="100" style="cursor: pointer"
            (click)="predict({'smilesInput': 'CCC(C)C1C(CCC2(O1)CC3CC(O2)CC=C(C(C(C=CC=C4COC5C4(C(C=C(C5O)C)C(=O)O3)O)C)OC6CC(C(C(O6)C)OC7CC(C(C(O7)C)O)OC)OC)C)C'})">
                    </a>
                    <p>Ivermectin</p>
                </div>
                <div class="col-xs-8 text-center">
                    <a> <img src="assets/img/molnupiravir.png" width="200" height="100" style="cursor: pointer"
                    (click)="predict({'smilesInput': 'CC(C)C(=O)OC[C@H]1O[C@H]([C@H](O)[C@@H]1O)N2C=C\\C(=N\\O)\\NC2=O'})">
                    </a>
                    <p>Molnupiravir</p>
                </div>
                <div class="col-xs-8 text-center">
                    <a> <img src="assets/img/thalidomide.png" width="200" height="100" style="cursor: pointer"
                    (click)="predict({'smilesInput': 'O=C3CCC(N2C(=O)c1ccccc1C2=O)C(=O)N3'});">
                    </a>
                    <p>Thalidomide</p>
                </div>
            </div>
        </div>
</div>
